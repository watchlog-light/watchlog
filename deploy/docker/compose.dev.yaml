# Local development infrastructure (ADR-013): PostgreSQL 16, VictoriaMetrics, Redis 7,
# and Mailpit, which catches alert emails (ADR-082; web UI on :8025).
# Backend and web run on the host with `pnpm dev`.
#
#   pnpm infra:up     # docker compose -f deploy/docker/compose.dev.yaml up -d --wait
#   pnpm infra:down
#
# Host ports are offset from the defaults so they do not clash with other local
# databases, bound to 127.0.0.1 only, and overridable via environment variables.
name: watchlog-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: watchlog
      POSTGRES_PASSWORD: watchlog
      POSTGRES_DB: watchlog
    ports:
      - '127.0.0.1:${WATCHLOG_PG_PORT:-54320}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U watchlog -d watchlog']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.155.0
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=15d
      - -httpListenAddr=:8428
      # Agents push every 15 s; the 30 s default hid the first samples (ADR-045).
      - -search.latencyOffset=5s
    ports:
      - '127.0.0.1:${WATCHLOG_VM_PORT:-8428}:8428'
    volumes:
      - victoriametrics-data:/storage
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8428/health']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${WATCHLOG_REDIS_PORT:-63790}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:${WATCHLOG_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${WATCHLOG_MAILPIT_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
  victoriametrics-data:
  redis-data:
