# SPDX-License-Identifier: AGPL-3.0-only
# Node agent DaemonSet and cluster-agent for kind/k3s tests (Phase 2 slice 4), applied
# by agents-up.sh. Not the Helm chart (slice 5); RBAC and security settings follow
# ADR-049, ADR-051, ADR-060 and ADR-066.
apiVersion: v1
kind: Namespace
metadata:
  name: watchlog
  labels:
    # Baseline forbids the agent's read-only hostPath mounts of /proc and /sys (ADR-060).
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: watchlog-agent, namespace: watchlog }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: watchlog-cluster-agent, namespace: watchlog }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: watchlog-cluster-agent }
rules:
  - apiGroups: ['']
    resources: [nodes, namespaces, pods, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  # Authenticates node agents asking for their pod map (ADR-066).
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: watchlog-cluster-agent }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: watchlog-cluster-agent }
subjects: [{ kind: ServiceAccount, name: watchlog-cluster-agent, namespace: watchlog }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: watchlog-cluster-agent-lease, namespace: watchlog }
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: watchlog-cluster-agent-lease, namespace: watchlog }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: watchlog-cluster-agent-lease }
subjects: [{ kind: ServiceAccount, name: watchlog-cluster-agent, namespace: watchlog }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: watchlog-agent }
rules:
  # The node's own kubelet /stats/summary only; no nodes/proxy (ADR-049).
  - apiGroups: ['']
    resources: [nodes/stats]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: watchlog-agent }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: watchlog-agent }
subjects: [{ kind: ServiceAccount, name: watchlog-agent, namespace: watchlog }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: watchlog-cluster-agent, namespace: watchlog }
spec:
  replicas: 1
  # A synced standby is ready and serves the pod map; the leader releases the Lease
  # on SIGTERM (ADR-068).
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  selector: { matchLabels: { app: watchlog-cluster-agent } }
  template:
    metadata: { labels: { app: watchlog-cluster-agent } }
    spec:
      serviceAccountName: watchlog-cluster-agent
      securityContext:
        {
          runAsNonRoot: true,
          runAsUser: 65532,
          runAsGroup: 65532,
          seccompProfile: { type: RuntimeDefault },
        }
      containers:
        - name: cluster-agent
          image: ghcr.io/watchlog-light/cluster-agent:dev
          imagePullPolicy: Never
          args:
            [--podmap-cert=/etc/watchlog/podmap/tls.crt, --podmap-key=/etc/watchlog/podmap/tls.key]
          env:
            - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: POD_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
            - {
                name: WATCHLOG_TOKEN,
                valueFrom: { secretKeyRef: { name: watchlog-agent, key: token } },
              }
            - {
                name: WATCHLOG_ENDPOINT,
                valueFrom: { secretKeyRef: { name: watchlog-agent, key: endpoint } },
              }
            - { name: GOMEMLIMIT, value: 400MiB }
          ports: [{ name: podmap, containerPort: 8443 }]
          readinessProbe:
            { httpGet: { path: /healthz, port: 8443, scheme: HTTPS }, periodSeconds: 5 }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }
          securityContext:
            {
              allowPrivilegeEscalation: false,
              readOnlyRootFilesystem: true,
              capabilities: { drop: [ALL] },
            }
          volumeMounts:
            - { name: podmap-tls, mountPath: /etc/watchlog/podmap, readOnly: true }
            - { name: data, mountPath: /var/lib/watchlog-agent }
      volumes:
        - { name: podmap-tls, secret: { secretName: watchlog-podmap-tls } }
        - { name: data, emptyDir: { sizeLimit: 256Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: watchlog-cluster-agent, namespace: watchlog }
spec:
  selector: { app: watchlog-cluster-agent }
  ports: [{ name: podmap, port: 8443, targetPort: podmap }]
---
apiVersion: apps/v1
kind: DaemonSet
metadata: { name: watchlog-agent, namespace: watchlog }
spec:
  selector: { matchLabels: { app: watchlog-agent } }
  template:
    metadata: { labels: { app: watchlog-agent } }
    spec:
      serviceAccountName: watchlog-agent
      hostNetwork: false
      hostPID: false
      tolerations: [{ operator: Exists }]
      securityContext:
        {
          runAsNonRoot: true,
          runAsUser: 65532,
          runAsGroup: 65532,
          seccompProfile: { type: RuntimeDefault },
        }
      containers:
        - name: agent
          image: ghcr.io/watchlog-light/agent:dev
          imagePullPolicy: Never
          args: [--mode=node]
          env:
            - { name: NODE_NAME, valueFrom: { fieldRef: { fieldPath: spec.nodeName } } }
            - { name: HOST_IP, valueFrom: { fieldRef: { fieldPath: status.hostIP } } }
            - {
                name: WATCHLOG_PODMAP_URL,
                value: 'https://watchlog-cluster-agent.watchlog.svc:8443',
              }
            - { name: WATCHLOG_KUBELET_TLS, value: auto }
            - {
                name: WATCHLOG_TOKEN,
                valueFrom: { secretKeyRef: { name: watchlog-agent, key: token } },
              }
            - {
                name: WATCHLOG_ENDPOINT,
                valueFrom: { secretKeyRef: { name: watchlog-agent, key: endpoint } },
              }
          resources: { requests: { cpu: 20m, memory: 48Mi }, limits: { memory: 128Mi } }
          securityContext:
            {
              allowPrivilegeEscalation: false,
              readOnlyRootFilesystem: true,
              capabilities: { drop: [ALL] },
            }
          volumeMounts:
            - { name: proc, mountPath: /host/proc, readOnly: true }
            - { name: sys, mountPath: /host/sys, readOnly: true }
            - {
                name: root,
                mountPath: /host/root,
                readOnly: true,
                mountPropagation: HostToContainer,
              }
            - { name: data, mountPath: /var/lib/watchlog-agent }
            - { name: podmap-ca, mountPath: /etc/watchlog/podmap, readOnly: true }
            - { name: podmap-token, mountPath: /var/run/secrets/watchlog/podmap, readOnly: true }
      volumes:
        - { name: proc, hostPath: { path: /proc } }
        - { name: sys, hostPath: { path: /sys } }
        - { name: root, hostPath: { path: / } }
        - { name: data, emptyDir: { sizeLimit: 256Mi } }
        - { name: podmap-ca, secret: { secretName: watchlog-podmap-ca } }
        - name: podmap-token
          projected:
            sources:
              - serviceAccountToken:
                  { audience: watchlog-cluster-agent, expirationSeconds: 3600, path: token }
