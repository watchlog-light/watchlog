# SPDX-License-Identifier: AGPL-3.0-only
# Service map demo app (Phase 4 acceptance, ADR-103): 8 services, images from ghcr.io
# and Docker Hub only. Expected edges, every one through its Service:
#   loadgen → frontend:9898 → cart:9898 → catalog:9898   (podinfo /echo forwards)
#   orders → postgres:5432       (inserts, reads and deletes in an orders table every 2 s)
#   sessions → redis:6379        (SET with a TTL, a hit and a miss every second)
apiVersion: v1
kind: Namespace
metadata:
  name: wl-demo
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: loadgen, namespace: wl-demo }
spec:
  selector: { matchLabels: { app: loadgen } }
  template:
    metadata: { labels: { app: loadgen } }
    spec:
      containers:
        - name: loadgen
          image: busybox:latest
          imagePullPolicy: IfNotPresent
          # A new connection for every request, 5 a second.
          command:
            [
              sh,
              -c,
              'while true; do wget -q -O /dev/null -T 2 --post-data=hello http://frontend:9898/echo; sleep 0.2; done',
            ]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: wl-demo }
spec:
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.16.0
          imagePullPolicy: IfNotPresent
          command: [./podinfo, --port=9898, --backend-url=http://cart:9898/echo]
          ports: [{ containerPort: 9898 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: cart, namespace: wl-demo }
spec:
  selector: { matchLabels: { app: cart } }
  template:
    metadata: { labels: { app: cart } }
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.16.0
          imagePullPolicy: IfNotPresent
          command: [./podinfo, --port=9898, --backend-url=http://catalog:9898/echo]
          ports: [{ containerPort: 9898 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: catalog, namespace: wl-demo }
spec:
  selector: { matchLabels: { app: catalog } }
  template:
    metadata: { labels: { app: catalog } }
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.16.0
          imagePullPolicy: IfNotPresent
          command: [./podinfo, --port=9898]
          ports: [{ containerPort: 9898 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, namespace: wl-demo }
spec:
  serviceName: postgres
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          # pg_stat_statements for WatchLog's query tables (demo-up.sh creates the extension).
          args: [-c, shared_preload_libraries=pg_stat_statements, -c, compute_query_id=on]
          env: [{ name: POSTGRES_PASSWORD, value: demo }]
          ports: [{ containerPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: orders, namespace: wl-demo }
spec:
  selector: { matchLabels: { app: orders } }
  template:
    metadata: { labels: { app: orders } }
    spec:
      containers:
        - name: orders
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env: [{ name: PGPASSWORD, value: demo }]
          command:
            [
              sh,
              -c,
              'while true; do psql -h postgres -U postgres -qc "create table if not exists orders (id bigserial primary key, item int, at timestamptz default now()); insert into orders (item) select g from generate_series(1, 20) g; select count(*) from orders where at > now() - make_interval(mins => 1); delete from orders where at < now() - make_interval(mins => 5)" >/dev/null 2>&1; sleep 2; done',
            ]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: wl-demo }
spec:
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: sessions, namespace: wl-demo }
spec:
  selector: { matchLabels: { app: sessions } }
  template:
    metadata: { labels: { app: sessions } }
    spec:
      containers:
        - name: sessions
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          # Hits and misses, keys with a TTL: the Redis page's numbers move.
          command:
            [
              sh,
              -c,
              'while true; do redis-cli -h redis SET session:42 v EX 300 >/dev/null; redis-cli -h redis GET session:42 >/dev/null; redis-cli -h redis GET session:7 >/dev/null; sleep 1; done',
            ]
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: wl-demo }
spec: { selector: { app: frontend }, ports: [{ port: 9898 }] }
---
apiVersion: v1
kind: Service
metadata: { name: cart, namespace: wl-demo }
spec: { selector: { app: cart }, ports: [{ port: 9898 }] }
---
apiVersion: v1
kind: Service
metadata: { name: catalog, namespace: wl-demo }
spec: { selector: { app: catalog }, ports: [{ port: 9898 }] }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: wl-demo }
spec: { selector: { app: postgres }, ports: [{ port: 5432 }] }
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: wl-demo }
spec: { selector: { app: redis }, ports: [{ port: 6379 }] }
