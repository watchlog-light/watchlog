# SPDX-License-Identifier: AGPL-3.0-only
# Temporary single-node kubeadm + CRI-O cluster, only to capture the CRI-O cgroup
# layout (ADR-063); deleted after capture. CRI-O packages come from
# download.opensuse.org: the pkgs.k8s.io CDN path for CRI-O returned 403 from the
# owner's network (2026-10-31), the Kubernetes core path did not.
#   limactl create --name=watchlog-crio deploy/test/lima/kubeadm-crio.yaml && limactl start watchlog-crio
base: template:ubuntu-24.04
cpus: 2
memory: 3GiB
disk: 15GiB
mounts:
  - location: '/tmp/lima'
    writable: true
containerd:
  system: false
  user: false
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      test -f /etc/kubernetes/admin.conf && exit 0
      export DEBIAN_FRONTEND=noninteractive
      k8s=v1.36 crio=v1.36
      modprobe br_netfilter overlay
      printf 'br_netfilter\noverlay\n' > /etc/modules-load.d/k8s.conf
      printf 'net.ipv4.ip_forward=1\nnet.bridge.bridge-nf-call-iptables=1\n' > /etc/sysctl.d/k8s.conf
      sysctl --system >/dev/null
      apt-get update && apt-get install -y ca-certificates curl gpg
      curl -fsSL "https://pkgs.k8s.io/core:/stable:/$k8s/deb/Release.key" | gpg --dearmor -o /etc/apt/keyrings/kubernetes.gpg
      echo "deb [signed-by=/etc/apt/keyrings/kubernetes.gpg] https://pkgs.k8s.io/core:/stable:/$k8s/deb/ /" > /etc/apt/sources.list.d/kubernetes.list
      curl -fsSL "https://download.opensuse.org/repositories/isv:/cri-o:/stable:/$crio/deb/Release.key" | gpg --dearmor -o /etc/apt/keyrings/cri-o.gpg
      echo "deb [signed-by=/etc/apt/keyrings/cri-o.gpg] https://download.opensuse.org/repositories/isv:/cri-o:/stable:/$crio/deb/ /" > /etc/apt/sources.list.d/cri-o.list
      apt-get update && apt-get install -y cri-o kubelet kubeadm kubectl
      # The package ships its bridge CNI config disabled; a single node needs nothing else.
      mv /etc/cni/net.d/10-crio-bridge.conflist.disabled /etc/cni/net.d/10-crio-bridge.conflist
      systemctl enable --now crio kubelet
      kubeadm init --cri-socket unix:///var/run/crio/crio.sock --pod-network-cidr 10.85.0.0/16 \
        --apiserver-cert-extra-sans 127.0.0.1
      export KUBECONFIG=/etc/kubernetes/admin.conf
      kubectl taint nodes --all node-role.kubernetes.io/control-plane- || true
      install -m 644 /etc/kubernetes/admin.conf /tmp/lima/kubeadm-crio-admin.conf
probes:
  - mode: readiness
    description: kubeadm cluster is up
    script: |
      #!/bin/bash
      set -eux -o pipefail
      timeout 1200s bash -c "until test -f /tmp/lima/kubeadm-crio-admin.conf; do sleep 10; done"
