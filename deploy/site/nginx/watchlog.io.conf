# nginx for the static site at watchlog.io (deploy/site/DEPLOY.md). Include it in the
# http context: /etc/nginx/sites-available/watchlog.io, linked from sites-enabled.
# Cloudflare sits in front with SSL/TLS mode "Full (strict)", so this origin needs a
# certificate Cloudflare trusts: a Cloudflare origin certificate or Let's Encrypt, at
# the two paths below. Written for nginx 1.24 (Ubuntu 24.04); newer versions warn that
# "listen ... http2" is deprecated in favour of "http2 on;", which is harmless.

# Long cache for hashed assets, short for HTML (a deploy shows within 5 minutes), an
# hour for the rest. A map, because add_header inside a location would drop the
# security headers set at server level.
map $uri $watchlog_site_cache {
    ~^/_nuxt/          "public, max-age=31536000, immutable";
    ~(\.html|/)$       "public, max-age=300, must-revalidate";
    ~\.(xml|txt)$      "public, max-age=300, must-revalidate";
    default            "public, max-age=3600";
}

# Plain HTTP: everything to HTTPS on the apex.
server {
    listen 80;
    listen [::]:80;
    server_name watchlog.io www.watchlog.io;
    return 301 https://watchlog.io$request_uri;
}

# www → apex.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.watchlog.io;
    ssl_certificate     /etc/ssl/watchlog.io/fullchain.pem;
    ssl_certificate_key /etc/ssl/watchlog.io/privkey.pem;
    return 301 https://watchlog.io$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name watchlog.io;

    ssl_certificate     /etc/ssl/watchlog.io/fullchain.pem;
    ssl_certificate_key /etc/ssl/watchlog.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:watchlog_site:10m;
    ssl_session_timeout 1d;
    server_tokens off;

    # The current release: a symlink switched atomically by deploy-site.sh.
    root /var/www/watchlog.io/current;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json application/xml
               application/manifest+json image/svg+xml text/plain text/xml;

    add_header Cache-Control $watchlog_site_cache always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Everything is served from this origin. The one script is /js/site.js; the inline
    # speculation rules (link prefetch) are data, allowed by their own keyword. A waitlist
    # form posting elsewhere would need that origin in form-action.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'inline-speculation-rules'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;

    # Old v1 URLs.
    location ~ ^/(pricing|request-demo|enterprise)(/.*)?$ {
        return 301 https://watchlog.io/#cloud;
    }
    location ~ ^/privacy-policy/?$ {
        return 301 https://watchlog.io/legal/privacy/;
    }
    location ~ ^/terms-of-service/?$ {
        return 301 https://watchlog.io/legal/terms/;
    }
    location ~ ^/(products|integrations)(/.*)?$ {
        return 301 https://watchlog.io/;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
