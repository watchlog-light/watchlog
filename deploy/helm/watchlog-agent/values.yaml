# WatchLog agent chart (SPEC §6.7, ADR-059). Install from a repository checkout:
#   helm install watchlog-agent deploy/helm/watchlog-agent -n watchlog --create-namespace \
#     --set watchlog.endpoint=https://watchlog.example.com --set watchlog.clusterToken=wl_ct_...
# Resource names default to <release>-watchlog-agent, or the release name when it
# already contains "watchlog-agent".
fullnameOverride: ''

watchlog:
  # Base URL the agents push to (the backend or the web front door, which proxies /ingest).
  endpoint: ''
  # Cluster token from Settings → Clusters; or name a Secret with existingSecret.
  # endpoint and existingSecret may use templates (the watchlog chart sets both).
  clusterToken: ''
  existingSecret: ''
  existingSecretKey: token

image:
  registry: ghcr.io/watchlog-light
  # Defaults to the chart's appVersion. Images are not published before the Phase 4
  # launch (ADR-043): load locally built images (kind load / k3s ctr images import).
  tag: ''
  pullPolicy: IfNotPresent

agent:
  enabled: true
  interval: 15s
  networkFlows:
    # eBPF network flows for the service map (SPEC §6.4, opt-out). When enabled the node
    # agent runs as uid 0 with only the BPF and PERFMON capabilities (ADR-105,
    # docs/security.md); disabled, it runs as uid 65532 with none. Replaces
    # agent.ebpf.enabled, which charts before Phase 4 set to false and is ignored (ADR-107).
    enabled: true
  # Kubelet TLS (ADR-051): auto tries the cluster CA, then falls back and reports it.
  kubeletTLS: auto
  resources:
    requests: { cpu: 20m, memory: 48Mi }
    limits: { memory: 128Mi }
  # Run on every node, control plane included.
  tolerations: [{ operator: Exists }]
  nodeSelector: {}
  priorityClassName: ''

clusterAgent:
  enabled: true
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
  # Go heap target below the memory limit (ADR-058).
  goMemLimit: 400MiB
  nodeSelector: {}
  tolerations: []
