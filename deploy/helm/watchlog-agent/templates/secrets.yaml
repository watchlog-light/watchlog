{{/* SPDX-License-Identifier: AGPL-3.0-only */}}
{{- if not .Values.watchlog.existingSecret }}
{{- if not .Values.watchlog.clusterToken }}
{{- fail "set watchlog.clusterToken (from Settings → Clusters) or watchlog.existingSecret" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "watchlog-agent.tokenSecret" . }}
  labels: {{- include "watchlog-agent.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.watchlog.existingSecretKey }}: {{ .Values.watchlog.clusterToken | b64enc }}
{{- end }}
---
{{/*
Pod map TLS (ADR-066): a CA and the cluster-agent's service certificate, generated
once and kept on upgrades. The cluster-agent mounts the key; node agents mount only
ca.crt from this Secret (projected items), so neither agent needs Secret RBAC.
*/}}
{{- $name := printf "%s-podmap-tls" (include "watchlog-agent.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "watchlog-agent.labels" . | nindent 4 }}
type: Opaque
data:
{{- if and $existing (index $existing.data "ca.crt") }}
  ca.crt: {{ index $existing.data "ca.crt" }}
  tls.crt: {{ index $existing.data "tls.crt" }}
  tls.key: {{ index $existing.data "tls.key" }}
{{- else }}
{{- $svc := printf "%s.%s.svc" (include "watchlog-agent.clusterAgentService" .) .Release.Namespace }}
{{- $ca := genCA "watchlog-podmap-ca" 3650 }}
{{- $cert := genSignedCert $svc nil (list $svc (printf "%s.cluster.local" $svc)) 3650 $ca }}
  ca.crt: {{ $ca.Cert | b64enc }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
{{- end }}
