{{- $name := printf "%s-backend" .Release.Name }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "watchlog.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels: {{- include "watchlog.selector" (list .Release.Name "backend") | nindent 6 }}
  template:
    metadata:
      {{- if .Values.seed }}
      annotations:
        # A changed seed restarts the backend, which applies it at start (ADR-122).
        checksum/seed: {{ toJson .Values.seed | sha256sum }}
      {{- end }}
      labels: {{- include "watchlog.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      automountServiceAccountToken: false
      securityContext: {{- include "watchlog.podSecurity" 65532 | nindent 8 }}
      initContainers:
        # Forward-only migrations; retried with backoff until PostgreSQL is up.
        - name: migrate
          image: {{ include "watchlog.image" (list . "backend") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [dist/migrate.js]
          env: {{- include "watchlog.databaseEnv" . | nindent 12 }}
          securityContext: {{- include "watchlog.containerSecurity" . | nindent 12 }}
      containers:
        - name: backend
          image: {{ include "watchlog.image" (list . "backend") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "watchlog.databaseEnv" . | nindent 12 }}
            - name: VICTORIAMETRICS_URL
              value: http://{{ .Release.Name }}-victoriametrics:8428
            {{- include "watchlog.alertingEnv" . | nindent 12 }}
            # Browsers and outside agents arrive through the web service's Caddy.
            - { name: WATCHLOG_TRUST_PROXY, value: 'true' }
            - { name: WATCHLOG_EVENTS_RETENTION_DAYS, value: {{ .Values.backend.eventsRetentionDays | quote }} }
            - { name: WATCHLOG_BOOTSTRAP_CLUSTER_NAME, value: {{ .Values.clusterName | quote }} }
            - name: WATCHLOG_BOOTSTRAP_CLUSTER_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-cluster-token, key: token } }
            {{- if .Values.seed }}
            - { name: WATCHLOG_SEED_FILE, value: /etc/watchlog/seed/seed.json }
            {{- end }}
            {{- with .Values.backend.trustedProxies }}
            - { name: WATCHLOG_TRUSTED_PROXIES, value: {{ join "," . | quote }} }
            {{- end }}
            {{- with .Values.cookieSecure }}
            - { name: WATCHLOG_COOKIE_SECURE, value: {{ . | quote }} }
            {{- end }}
            {{- with .Values.backend.clientIpHeader }}
            # Rate limits per visitor behind a proxy that names the visitor in this header.
            - { name: WATCHLOG_CLIENT_IP_HEADER, value: {{ . | quote }} }
            {{- end }}
            {{- with .Values.backend.clientCountryHeader }}
            # The visitor's country, shown with an API token's last use (CF-IPCountry).
            - { name: WATCHLOG_CLIENT_COUNTRY_HEADER, value: {{ . | quote }} }
            {{- end }}
            {{- if eq (toString (.Values.mcp | default dict).enabled) "false" }}
            # The MCP server at /mcp is off (ADR-127); API tokens still read the REST API.
            - { name: WATCHLOG_MCP_ENABLED, value: 'false' }
            {{- end }}
            {{- if .Values.demoMode }}
            # A read-only public demo (ADR-122): passwordless viewer sessions, changes refused.
            - { name: WATCHLOG_DEMO_MODE, value: 'true' }
            {{- end }}
            {{- if .Values.admin.email }}
            - name: WATCHLOG_ADMIN_EMAIL
              valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-admin, key: email } }
            - name: WATCHLOG_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-admin, key: password } }
            {{- end }}
          ports:
            - { name: http, containerPort: 4080 }
          # Waits for PostgreSQL before listening (ADR-118); liveness starts after this.
          startupProbe:
            httpGet: { path: /api/v1/health, port: http }
            periodSeconds: 5
            failureThreshold: 72
          readinessProbe:
            httpGet: { path: /api/v1/health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/v1/health, port: http }
            periodSeconds: 20
            failureThreshold: 6
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext: {{- include "watchlog.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- if .Values.seed }}
            - { name: seed, mountPath: /etc/watchlog/seed, readOnly: true }
            {{- end }}
      volumes:
        - { name: tmp, emptyDir: {} }
        {{- if .Values.seed }}
        - name: seed
          configMap: { name: {{ .Release.Name }}-seed }
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "watchlog.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  selector: {{- include "watchlog.selector" (list .Release.Name "backend") | nindent 4 }}
  ports:
    - { name: http, port: 4080, targetPort: http }
