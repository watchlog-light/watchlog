{{/* SPDX-License-Identifier: AGPL-3.0-only */}}
{{- $db := printf "%s-postgresql" .Release.Name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $db }}
  labels: {{- include "watchlog.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ default (include "watchlog.keep" (list . $db "password" (randAlphaNum 32))) .Values.postgresql.password | quote }}
---
{{/*
The cluster token of this cluster's own agents (ADR-069): generated once, registered
by the backend after setup, read by the agents through existingSecret.
*/}}
{{- $token := printf "%s-cluster-token" .Release.Name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $token }}
  labels: {{- include "watchlog.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ include "watchlog.keep" (list . $token "token" (printf "wl_ct_%s" (randAlphaNum 43))) | quote }}
---
{{/*
The key for alert channel secrets (ADR-079): generated once, never at runtime, kept
across upgrades and on `helm uninstall`, so a reinstall over the same database works.
*/}}
{{- $key := printf "%s-secret-key" .Release.Name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $key }}
  labels: {{- include "watchlog.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  key: {{ default (include "watchlog.keep" (list . $key "key" (randBytes 32))) .Values.secretKey | quote }}
{{- $alerting := include "watchlog.alerting" . | fromYaml }}
{{- if $alerting.smtpUrl }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-smtp
  labels: {{- include "watchlog.labels" . | nindent 4 }}
type: Opaque
stringData:
  url: {{ $alerting.smtpUrl | quote }}
{{- end }}
{{- if .Values.admin.email }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-admin
  labels: {{- include "watchlog.labels" . | nindent 4 }}
type: Opaque
stringData:
  email: {{ .Values.admin.email | quote }}
  password: {{ required "admin.password is required with admin.email" .Values.admin.password | quote }}
{{- end }}
