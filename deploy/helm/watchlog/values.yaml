# SPDX-License-Identifier: AGPL-3.0-only
# WatchLog Community on Kubernetes (SPEC §5.3, ADR-059). From a repository checkout:
#   helm dependency build deploy/helm/watchlog
#   helm install watchlog deploy/helm/watchlog -n watchlog --create-namespace
#   kubectl -n watchlog logs deploy/watchlog-backend | grep "setup code"
#   kubectl -n watchlog port-forward svc/watchlog-web 8080    # then open http://localhost:8080
# The agents of this cluster report as soon as setup is complete (ADR-069).

image:
  registry: ghcr.io/watchlog-light
  # Defaults to the chart's appVersion. Images are not published before the Phase 4
  # launch (ADR-043): load locally built images (kind load / k3s ctr images import).
  tag: ''
  pullPolicy: IfNotPresent

# The address browsers and outside agents use; shown in install commands.
publicUrl: ''
# Optional first admin; without it the backend logs a one-time setup code.
admin:
  email: ''
  password: ''
# Encrypts alert channel secrets (ADR-079): 32 bytes, base64 (`openssl rand -base64 32`).
# Generated on install, kept on upgrades and on uninstall (Secret <release>-secret-key).
# Set it only to restore a backed-up key; back it up, or channel secrets are lost.
secretKey: ''
# The key before a rotation (docs/site/configuration.md, ADR-133): still decrypts until
# every backend and worker runs with the new secretKey; remove it afterwards.
secretKeyPrevious: ''
# Name of this cluster in WatchLog; its agents are registered automatically.
clusterName: kubernetes
# The MCP server at /mcp (ADR-127): Claude, Cursor and other AI assistants read your
# clusters with a personal API token (Settings → API tokens). It needs a token, so it is
# on by default; false turns it off (404), and tokens still read the REST API.
mcp:
  enabled: true
# A read-only public demo (ADR-122): anyone can open the dashboard as a viewer without a
# password, and every change is refused, admins included. Not for a real installation.
demoMode: false
# The session cookie's Secure attribute: auto (when the request came over https, from
# the socket or a trusted proxy's X-Forwarded-Proto), always, or never.
cookieSecure: auto
# Configuration applied at every backend start (ADR-122), e.g. a demo's alert rules:
#   seed:
#     alertRules:
#       - { name: Node memory above 75%, metric: node.memory.utilization, clusterId: null,
#           scope: {}, condition: { op: '>', value: 0.75 }, forSeconds: 300, severity: warning }
# Each rule is created once, matched by name, and never overwritten. clusterId is null
# (every cluster) or a cluster's name or id. Rules only: no channels, nothing secret.
seed: {}

backend:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { memory: 512Mi }
  eventsRetentionDays: 15
  # A header the proxy in front sets to the visitor's address (nginx: X-Real-IP), so rate
  # limits count each visitor. Leave empty unless that proxy always sets it.
  clientIpHeader: ''
  # A header the proxy in front sets to the visitor's country (Cloudflare: CF-IPCountry),
  # shown with an API token's last use. Empty: no country.
  clientCountryHeader: ''
  # The proxies whose client-IP header and X-Forwarded-Proto are believed, as CIDRs.
  # Empty: loopback and private ranges (the web pod).
  trustedProxies: []

# Evaluates alert rules and sends notifications (ADR-073); more replicas share the work.
alertWorker:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }

alerting:
  # SMTP server for email channels, e.g. smtp://user:password@smtp.example.com:587
  # (stored in a Secret). Without it email channels report an error.
  smtpUrl: ''
  smtpFrom: 'WatchLog <alerts@example.com>'
  # Telegram Bot API base URL; change only to use a mirror (default api.telegram.org).
  telegramApiUrl: ''
  # Outbound proxy for Slack, Telegram and webhook deliveries.
  httpsProxy: ''
  noProxy: ''

web:
  replicas: 1
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 128Mi }
  service:
    type: ClusterIP
    port: 8080

ingress:
  enabled: false
  className: ''
  host: ''
  annotations: {}
  # Secret with the certificate for host; empty serves plain HTTP.
  tlsSecret: ''

postgresql:
  image: postgres:16-alpine
  # Generated on install and kept on upgrades when empty.
  password: ''
  storage: 8Gi
  storageClass: ''
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

victoriametrics:
  image: victoriametrics/victoria-metrics:v1.155.0
  retention: 15d
  storage: 20Gi
  storageClass: ''
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 2Gi }
  # More VictoriaMetrics flags, e.g. query limits for a public demo; unset by default so
  # either form can be given without a type warning:
  #   extraArgs: [-search.maxQueryDuration=10s, -search.maxConcurrentRequests=4]
  #   extraArgs: { search.maxQueryDuration: 10s, search.maxConcurrentRequests: 4 }

# The agents of this cluster (the watchlog-agent chart). endpoint and token point at
# this release; override only to run them elsewhere.
watchlog-agent:
  enabled: true
  fullnameOverride: watchlog-agent
  watchlog:
    endpoint: 'http://{{ .Release.Name }}-backend:4080'
    existingSecret: '{{ .Release.Name }}-cluster-token'
    existingSecretKey: token
