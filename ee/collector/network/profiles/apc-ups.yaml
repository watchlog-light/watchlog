# APC Smart-UPS with a Network Management Card (0.17, ADR-234), from APC's PowerNet-MIB.
name: apc-ups
vendor: APC
extends: generic
kind: ups
match:
  sysObjectID: ['1.3.6.1.4.1.318.1.3.']
  probe: 1.3.6.1.4.1.318.1.1.1.1.1.1.0 # upsBasicIdentModel

ups:
  model: { oid: 1.3.6.1.4.1.318.1.1.1.1.1.1.0 } # upsBasicIdentModel
  status:
    oid: 1.3.6.1.4.1.318.1.1.1.4.1.1.0 # upsBasicOutputStatus
    states:
      {
        1: unknown,
        2: online,
        3: on-battery,
        4: online,
        5: off,
        6: bypass,
        7: off,
        8: off,
        9: bypass,
        10: bypass,
        11: off,
        12: online,
      }
  charge: { oid: 1.3.6.1.4.1.318.1.1.1.2.2.1.0 } # upsAdvBatteryCapacity (%)
  runtime: { oid: 1.3.6.1.4.1.318.1.1.1.2.2.3.0, scale: 0.01 } # upsAdvBatteryRunTimeRemaining (TimeTicks)
  load: { oid: 1.3.6.1.4.1.318.1.1.1.4.2.3.0 } # upsAdvOutputLoad (%)
  inputVolts: { oid: 1.3.6.1.4.1.318.1.1.1.3.2.1.0 } # upsAdvInputLineVoltage
  outputVolts: { oid: 1.3.6.1.4.1.318.1.1.1.4.2.1.0 } # upsAdvOutputVoltage
  celsius: { oid: 1.3.6.1.4.1.318.1.1.1.2.2.2.0 } # upsAdvBatteryTemperature
  replace:
    oid: 1.3.6.1.4.1.318.1.1.1.2.2.4.0 # upsAdvBatteryReplaceIndicator
    states: { 1: ok, 2: replace }
