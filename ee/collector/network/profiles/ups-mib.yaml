# Any UPS with RFC 1628's UPS-MIB (0.17, ADR-234): Eaton, CyberPower, Riello, APC with the
# UPS-MIB card, and others.
name: ups-mib
vendor: ''
extends: generic
kind: ups
match:
  probe: 1.3.6.1.2.1.33.1.1.2.0 # upsIdentModel

ups:
  model: { oid: 1.3.6.1.2.1.33.1.1.2.0 } # upsIdentModel
  status:
    oid: 1.3.6.1.2.1.33.1.4.1.0 # upsOutputSource
    states: { 1: unknown, 2: off, 3: online, 4: bypass, 5: on-battery, 6: online, 7: online }
  charge: { oid: 1.3.6.1.2.1.33.1.2.4.0 } # upsEstimatedChargeRemaining (%)
  runtime: { oid: 1.3.6.1.2.1.33.1.2.3.0, scale: 60 } # upsEstimatedMinutesRemaining
  load: { oid: 1.3.6.1.2.1.33.1.4.4.1.5.1 } # upsOutputPercentLoad, line 1
  inputVolts: { oid: 1.3.6.1.2.1.33.1.3.3.1.3.1 } # upsInputVoltage, line 1
  outputVolts: { oid: 1.3.6.1.2.1.33.1.4.4.1.2.1 } # upsOutputVoltage, line 1
  celsius: { oid: 1.3.6.1.2.1.33.1.2.7.0 } # upsBatteryTemperature
  alarmTable: 1.3.6.1.2.1.33.1.6.2.1.2 # upsAlarmDescr
  replaceAlarm: 1.3.6.1.2.1.33.1.6.3.1 # upsAlarmBatteryBad
