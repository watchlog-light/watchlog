# QNAP NAS on QTS 5 (0.17, ADR-234), from QNAP's NAS-MIB (enterprise
# 24681) as published: the storage manager's tables (1.3.6.1.4.1.24681.1.4.1.1.1, .1.4.1.1.2
# for iSCSI) first, the 64-bit "EX" tables (1.3.6.1.4.1.24681.1.3) as the fallback, plus
# HOST-RESOURCES and IF-MIB from generic. Table OIDs are the entries (table.1); columns
# follow. Not confirmed on real hardware (pending review).
name: qnap
vendor: QNAP
extends: generic
kind: nas
match:
  sysDescr: ['qnap', 'QTS']
  # modelNameEX: answers only on a QNAP (its sysObjectID can be Linux's).
  probe: 1.3.6.1.4.1.24681.1.3.12.0

nas:
  model: 1.3.6.1.4.1.24681.1.3.12.0 # modelNameEX
  cpuCelsius: 1.3.6.1.4.1.24681.1.3.5.0 # cpu-TemperatureEX (°C)
  systemCelsius: 1.3.6.1.4.1.24681.1.3.6.0 # systemTemperatureEX (°C)
  disks:
    - # diskTable (storage manager)
      model: { oid: 1.3.6.1.4.1.24681.1.4.1.1.1.1.5.2.1.8 } # diskModel
      celsius: { oid: 1.3.6.1.4.1.24681.1.4.1.1.1.1.5.2.1.6 } # diskTemperture (sic)
      smart:
        oid: 1.3.6.1.4.1.24681.1.4.1.1.1.1.5.2.1.5 # diskSmartInfo
        states: { -1: error, 0: good, 1: warning, 2: abnormal }
      capacity: { oid: 1.3.6.1.4.1.24681.1.4.1.1.1.1.5.2.1.9 } # diskCapacity (bytes)
    - # systemHdTableEX
      name: { oid: 1.3.6.1.4.1.24681.1.3.11.1.2 } # hdDescrEX
      celsius: { oid: 1.3.6.1.4.1.24681.1.3.11.1.3 } # hdTemperatureEX (°C)
      status:
        oid: 1.3.6.1.4.1.24681.1.3.11.1.4 # hdStatusEX
        states: { -9: rw-error, -6: invalid, -5: no-disk, -4: unknown, 0: ready }
      model: { oid: 1.3.6.1.4.1.24681.1.3.11.1.5 } # hdModelEX
      capacity: { oid: 1.3.6.1.4.1.24681.1.3.11.1.6 } # hdCapacityEX (bytes)
      smart: { oid: 1.3.6.1.4.1.24681.1.3.11.1.7 } # hdSmartInfoEX ("GOOD")
  volumes:
    - # volumeTable (storage manager)
      total: { oid: 1.3.6.1.4.1.24681.1.4.1.1.1.2.3.2.1.3 } # volumeCapacity
      free: { oid: 1.3.6.1.4.1.24681.1.4.1.1.1.2.3.2.1.4 } # volumeFreeSize
      status: { oid: 1.3.6.1.4.1.24681.1.4.1.1.1.2.3.2.1.5 } # volumeStatus ("Ready")
      name: { oid: 1.3.6.1.4.1.24681.1.4.1.1.1.2.3.2.1.8 } # volumeName
    - # systemVolumeTableEx
      name: { oid: 1.3.6.1.4.1.24681.1.3.17.1.2 } # sysVolumeDescrEX
      total: { oid: 1.3.6.1.4.1.24681.1.3.17.1.4 } # sysVolumeTotalSizeEX
      free: { oid: 1.3.6.1.4.1.24681.1.3.17.1.5 } # sysVolumeFreeSizeEX
      status: { oid: 1.3.6.1.4.1.24681.1.3.17.1.6 } # sysVolumeStatusEX
  pools:
    - # poolTable
      total: { oid: 1.3.6.1.4.1.24681.1.4.1.1.1.2.2.2.1.3 } # poolCapacity
      free: { oid: 1.3.6.1.4.1.24681.1.4.1.1.1.2.2.2.1.4 } # poolFreeSize
      status:
        oid: 1.3.6.1.4.1.24681.1.4.1.1.1.2.2.2.1.5 # poolStatus
        states: { -3: error, -2: not-ready, -1: warning, 0: ready }
  raid:
    - # raidGroupTable
      total: { oid: 1.3.6.1.4.1.24681.1.4.1.1.1.2.1.2.1.3 } # raidCapacity
      free: { oid: 1.3.6.1.4.1.24681.1.4.1.1.1.2.1.2.1.4 } # raidFreeSize
      status: { oid: 1.3.6.1.4.1.24681.1.4.1.1.1.2.1.2.1.5 } # raidStatus ("Ready", "Degraded", "Rebuilding")
      raid: { oid: 1.3.6.1.4.1.24681.1.4.1.1.1.2.1.2.1.7 } # raidLevel
  luns:
    - # lunTable
      capacity: { oid: 1.3.6.1.4.1.24681.1.4.1.1.2.1.10.2.1.3 } # lunCapacity (bytes)
      usedPercent: { oid: 1.3.6.1.4.1.24681.1.4.1.1.2.1.10.2.1.4 } # lunUsedPercent
      status: { oid: 1.3.6.1.4.1.24681.1.4.1.1.2.1.10.2.1.5 } # lunStatus
      name: { oid: 1.3.6.1.4.1.24681.1.4.1.1.2.1.10.2.1.6 } # lunName
      mapped: { oid: 1.3.6.1.4.1.24681.1.4.1.1.2.1.10.2.1.8 } # lunIsMap (1 mapped)
  targets:
    - # targeTable (sic)
      name: { oid: 1.3.6.1.4.1.24681.1.4.1.1.2.1.11.2.1.3 } # targetName
      iqn: { oid: 1.3.6.1.4.1.24681.1.4.1.1.2.1.11.2.1.4 } # targetIQN
      status:
        oid: 1.3.6.1.4.1.24681.1.4.1.1.2.1.11.2.1.5 # targetStatus
        states: { -1: offline, 0: ready, 1: connected }
  fans:
    - # systemFan2Table
      status:
        oid: 1.3.6.1.4.1.24681.1.4.1.1.1.1.2.2.1.4 # systemFanStatus
        states: { -1: failed, 0: ok }
    - # systemFanTableEx
      name: { oid: 1.3.6.1.4.1.24681.1.3.15.1.2 } # sysFanDescrEX
      speed: { oid: 1.3.6.1.4.1.24681.1.3.15.1.3 } # sysFanSpeedEX (RPM)
  powerSupplies:
    - # systemPowerTable
      status:
        oid: 1.3.6.1.4.1.24681.1.4.1.1.1.1.3.2.1.4 # systemPowerStatus
        states: { -1: failed, 0: ok }
