# Cisco Catalyst on IOS and IOS-XE (ADR-233), from Cisco's
# public MIBs: CISCO-PROCESS-MIB, CISCO-ENHANCED-MEMPOOL-MIB, CISCO-MEMORY-POOL-MIB,
# CISCO-ENVMON-MIB, CISCO-ENTITY-SENSOR-MIB, CISCO-CDP-MIB, CISCO-POWER-ETHERNET-EXT-MIB,
# CISCO-STACKWISE-MIB and CISCO-VTP-MIB for the per-VLAN MAC tables.
name: cisco-ios
vendor: Cisco
extends: generic
kind: switch
match:
  sysObjectID: ['1.3.6.1.4.1.9.1.']
  notSysDescr: ['NX-OS']

cpu:
  - oid: 1.3.6.1.4.1.9.9.109.1.1.1.1.7 # cpmCPUTotal1minRev (percent)
    scale: 0.01
    aggregate: max

memory:
  - name: 1.3.6.1.4.1.9.9.221.1.1.1.1.3 # cempMemPoolName
    nameMatch: '^(processor|system memory)'
    used: 1.3.6.1.4.1.9.9.221.1.1.1.1.18 # cempMemPoolHCUsed
    free: 1.3.6.1.4.1.9.9.221.1.1.1.1.20 # cempMemPoolHCFree
  - name: 1.3.6.1.4.1.9.9.48.1.1.1.2 # ciscoMemoryPoolName
    nameMatch: '^processor'
    used: 1.3.6.1.4.1.9.9.48.1.1.1.5 # ciscoMemoryPoolUsed
    free: 1.3.6.1.4.1.9.9.48.1.1.1.6 # ciscoMemoryPoolFree

temperatures:
  - name: 1.3.6.1.4.1.9.9.13.1.3.1.2 # ciscoEnvMonTemperatureStatusDescr
    value: 1.3.6.1.4.1.9.9.13.1.3.1.3 # ciscoEnvMonTemperatureStatusValue (°C)
    threshold: 1.3.6.1.4.1.9.9.13.1.3.1.4 # ciscoEnvMonTemperatureThreshold
    state: 1.3.6.1.4.1.9.9.13.1.3.1.6 # ciscoEnvMonTemperatureState
    states: &envmon { 1: ok, 2: warning, 3: critical, 4: critical, 5: absent, 6: failed }

fans:
  - name: 1.3.6.1.4.1.9.9.13.1.4.1.2 # ciscoEnvMonFanStatusDescr
    state: 1.3.6.1.4.1.9.9.13.1.4.1.3 # ciscoEnvMonFanState
    states: *envmon

psus:
  - name: 1.3.6.1.4.1.9.9.13.1.5.1.2 # ciscoEnvMonSupplyStatusDescr
    state: 1.3.6.1.4.1.9.9.13.1.5.1.3 # ciscoEnvMonSupplyState
    states: *envmon

sensors:
  type: 1.3.6.1.4.1.9.9.91.1.1.1.1.1 # entSensorType (celsius 8, dBm 14)
  scale: 1.3.6.1.4.1.9.9.91.1.1.1.1.2 # entSensorScale (milli 8, units 9)
  precision: 1.3.6.1.4.1.9.9.91.1.1.1.1.3 # entSensorPrecision
  value: 1.3.6.1.4.1.9.9.91.1.1.1.1.4 # entSensorValue
  status: 1.3.6.1.4.1.9.9.91.1.1.1.1.5 # entSensorStatus (ok 1)
  thresholds: 1.3.6.1.4.1.9.9.91.1.2.1.1 # entSensorThresholdEntry: .2 severity, .3 relation, .4 value
  celsius: 8
  dbm: 14

neighbours:
  - protocol: cdp
    address: 1.3.6.1.4.1.9.9.23.1.2.1.1.4 # cdpCacheAddress
    deviceID: 1.3.6.1.4.1.9.9.23.1.2.1.1.6 # cdpCacheDeviceId
    port: 1.3.6.1.4.1.9.9.23.1.2.1.1.7 # cdpCacheDevicePort
    platform: 1.3.6.1.4.1.9.9.23.1.2.1.1.8 # cdpCachePlatform
  - protocol: lldp
    chassisID: 1.0.8802.1.1.2.1.4.1.1.5
    port: 1.0.8802.1.1.2.1.4.1.1.7
    portDescr: 1.0.8802.1.1.2.1.4.1.1.8
    sysName: 1.0.8802.1.1.2.1.4.1.1.9
    platform: 1.0.8802.1.1.2.1.4.1.1.10
    localPort: 1.0.8802.1.1.2.1.3.7.1.3
    localDescr: 1.0.8802.1.1.2.1.3.7.1.4
    manAddr: 1.0.8802.1.1.2.1.4.2.1.3

macs:
  basePortIfIndex: 1.3.6.1.2.1.17.1.4.1.2
  fdbPort: 1.3.6.1.2.1.17.4.3.1.2
  fdbStatus: 1.3.6.1.2.1.17.4.3.1.3
  # IOS keeps BRIDGE-MIB per VLAN: v2c community@vlan, v3 context vlan-<id>.
  perVLAN: cisco
  vlanList: 1.3.6.1.4.1.9.9.46.1.3.1.1.2 # vtpVlanState, index 1.<vlan> (operational 1)

poe:
  detection: 1.3.6.1.2.1.105.1.1.1.6 # pethPsePortDetectionStatus
  consumption: 1.3.6.1.4.1.9.9.402.1.2.1.9 # cpeExtPsePortPwrConsumption (mW), by group.port
  portName: 1.3.6.1.4.1.9.9.402.1.2.1.11 # cpeExtPsePortEntPhyIndex → entPhysicalName

stack:
  number: 1.3.6.1.4.1.9.9.500.1.2.1.1.1 # cswSwitchNumCurrent
  role: 1.3.6.1.4.1.9.9.500.1.2.1.1.3 # cswSwitchRole
  state: 1.3.6.1.4.1.9.9.500.1.2.1.1.6 # cswSwitchState
  roles: { 1: active, 2: member, 3: not-member, 4: standby }
  states:
    {
      1: waiting,
      2: progressing,
      3: added,
      4: ready,
      5: sdm-mismatch,
      6: version-mismatch,
      7: feature-mismatch,
      8: new-active-init,
      9: provisioned,
      10: invalid,
      11: removed,
    }
