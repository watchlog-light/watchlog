name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      placeholder: |
        1. Install with ...
        2. Open ...
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installed with
      options:
        - Helm (watchlog chart)
        - Helm (watchlog-agent chart only)
        - Docker Compose (self-hosted backend)
        - Docker agent (docker run)
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: WatchLog version
      description: Settings shows the backend version; the agent prints its own with --version.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Kubernetes distribution and version, or Docker version; Linux kernel (uname -r) for network-flow issues.
      placeholder: kind 0.33 / Kubernetes 1.34, kernel 6.8
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Agent or backend logs around the problem. Remove tokens and hostnames you don't want public.
      render: text
