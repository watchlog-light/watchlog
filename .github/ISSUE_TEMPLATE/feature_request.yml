name: Feature request
description: Something WatchLog should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to see or do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working. Optional.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Cluster size, Docker or Kubernetes, anything that matters.
