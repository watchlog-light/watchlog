# SPDX-License-Identifier: AGPL-3.0-only
# Verifies a published release the way a stranger would, from a clean runner with no
# registry login: every image pulls anonymously for linux/amd64 and linux/arm64, both
# charts pull from GHCR, and cosign verifies the signature of all six against this
# repository's release workflow. Run it after making a release's packages public.
name: Verify release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v, e.g. 1.4.0
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ inputs.version }}
      REGISTRY: ghcr.io/watchlog-light
    steps:
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.5.0
      - name: Images pull anonymously, both platforms
        run: |
          for i in agent cluster-agent integrations backend web; do
            ref="$REGISTRY/$i:$VERSION"
            docker pull -q "$ref" >/dev/null
            archs=$(docker manifest inspect "$ref" | jq -r '[.manifests[] | select(.platform.os=="linux") | .platform.architecture] | unique | join(",")')
            echo "$ref: $archs"
            [ "$archs" = "amd64,arm64" ] || { echo "missing a platform"; exit 1; }
          done
      - name: Charts pull anonymously
        run: |
          mkdir -p charts
          for c in watchlog watchlog-agent; do helm pull "oci://$REGISTRY/charts/$c" --version "$VERSION" -d charts; done
          ls -l charts
      - name: cosign verify (images and charts)
        run: |
          for ref in agent cluster-agent integrations backend web charts/watchlog charts/watchlog-agent; do
            cosign verify "$REGISTRY/$ref:$VERSION" \
              --certificate-identity-regexp '^https://github.com/watchlog-light/watchlog/\.github/workflows/release\.yml@refs/tags/v' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
            echo "verified: $ref:$VERSION"
          done
      # The server assets (ADR-209): every file on the release, its checksum, the signed
      # SHA256SUMS, and the install script and the deb doing what a user runs on this runner.
      - name: Server assets download anonymously, match SHA256SUMS, signature verifies
        run: |
          mkdir -p servers && cd servers
          base="https://github.com/watchlog-light/watchlog/releases/download/v$VERSION"
          for f in SHA256SUMS SHA256SUMS.sigstore.json install.sh \
            "watchlog-agent_${VERSION}_linux_amd64.tar.gz" "watchlog-agent_${VERSION}_linux_arm64.tar.gz" \
            "watchlog-agent_${VERSION}_amd64.deb" "watchlog-agent_${VERSION}_arm64.deb" \
            "watchlog-agent-${VERSION}-1.x86_64.rpm" "watchlog-agent-${VERSION}-1.aarch64.rpm"; do
            curl -fsSLO "$base/$f" || { echo "missing on the release: $f"; exit 1; }
          done
          sha256sum -c SHA256SUMS --ignore-missing
          [ "$(sha256sum -c SHA256SUMS --ignore-missing 2>/dev/null | grep -c ': OK')" -ge 6 ] || { echo "too few files checked"; exit 1; }
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \
            --certificate-identity-regexp '^https://github.com/watchlog-light/watchlog/\.github/workflows/release\.yml@refs/tags/v' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
          echo "verified: SHA256SUMS"
      - name: The install script installs this release, and the agent runs as watchlog
        run: |
          curl -fsSL "https://github.com/watchlog-light/watchlog/releases/download/v$VERSION/install.sh" |
            sudo sh -s -- --token wl_ct_verifyreleaseverifyrelease --url http://127.0.0.1:9 --version "$VERSION"
          sleep 3
          systemctl is-active watchlog-agent watchlog-integrations
          [ "$(ps -o user= -p "$(systemctl show -p MainPID --value watchlog-agent)")" = watchlog ]
          /usr/bin/watchlog-agent --version | grep -q "$VERSION"
          curl -fsSL "https://github.com/watchlog-light/watchlog/releases/download/v$VERSION/install.sh" | sudo sh -s -- --uninstall
