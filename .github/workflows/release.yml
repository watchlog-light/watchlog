# SPDX-License-Identifier: AGPL-3.0-only
# Release: on a tag vX.Y.Z on main, builds multi-arch images, pushes
# them to ghcr.io/watchlog-light/*, signs them with cosign (keyless, this workflow's
# OIDC identity), packages both Helm charts and pushes them to GHCR as OCI artifacts
# (signed too), and creates the GitHub release with notes from
# scripts/release/changelog.sh. Nothing here runs on branches or pull requests.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/watchlog-light

jobs:
  check:
    name: Tag is a release of main
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        name: Version from the tag
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF_NAME is not on main"; exit 1; }
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  images:
    name: Image (${{ matrix.image }})
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: agent
            context: agent
            dockerfile: agent/Dockerfile
            target: agent
          - image: cluster-agent
            context: agent
            dockerfile: agent/Dockerfile
            target: cluster-agent
          - image: backend
            context: .
            dockerfile: backend/Dockerfile
          - image: web
            context: .
            dockerfile: web/Dockerfile
    steps:
      - uses: actions/checkout@v7
      # The backend's native modules are installed for arm64 under emulation (ADR-026).
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        name: Build and push linux/amd64 and linux/arm64
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.image }}:${{ needs.check.outputs.version }}
            ${{ env.REGISTRY }}/${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          build-args: |
            VERSION=${{ needs.check.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.5.0
      - name: Sign the image (keyless)
        run: cosign sign --yes "$REGISTRY/${{ matrix.image }}@${{ steps.build.outputs.digest }}"

  charts:
    name: Helm charts
    needs: [check, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Package both charts at the release version
        run: scripts/release/package-charts.sh "${{ needs.check.outputs.version }}" dist/charts
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.5.0
      - name: Push to GHCR as OCI artifacts and sign them
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tgz in dist/charts/*.tgz; do
            out=$(helm push "$tgz" "oci://$REGISTRY/charts" 2>&1)
            echo "$out"
            ref=$(sed -nE 's/^Pushed: ([^ ]+):.*/\1/p' <<<"$out")
            digest=$(sed -nE 's/^Digest: (sha256:[0-9a-f]+).*/\1/p' <<<"$out")
            if [ -z "$ref" ] || [ -z "$digest" ]; then echo "no digest for $tgz"; exit 1; fi
            cosign sign --yes "$ref@$digest"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: charts
          path: dist/charts/*.tgz

  release:
    name: GitHub release
    needs: [check, images, charts]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: charts
          path: dist/charts
      - name: Release notes
        run: scripts/release/changelog.sh "$GITHUB_REF_NAME" > dist/notes.md
      - name: Create the release with the charts attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/charts/*.tgz \
            --title "WatchLog $GITHUB_REF_NAME" --notes-file dist/notes.md --verify-tag
