# SPDX-License-Identifier: AGPL-3.0-only
# CLA Assistant (SPEC §3.4, CONTRIBUTING.md): asks first-time contributors to sign CLA.md
# with a comment and records signatures on the cla-signatures branch. It never checks
# out or runs pull request code, so pull_request_target is safe here.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    runs-on: ubuntu-24.04
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/watchlog-light/watchlog/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: mohammadnajm,dependabot[bot],renovate[bot]
