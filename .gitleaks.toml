# Secret scanning (CI job "Secrets"). Allowed below: findings reviewed on
# 2026-11-01 as not secret: the published development key and redaction test fixtures.
[extend]
useDefault = true

[allowlist]
description = "Reviewed false positives"
paths = [
  # Redaction tests: AWS's documented example key, a fake GitHub token, jwt.io's sample.
  '''agent/internal/redact/redact_test\.go''',
  # Captured health check of a test container that used a fake password.
  '''agent/internal/docker/testdata/''',
]
regexes = [
  # DEV_SECRET_KEY: base64 of "watchlog-dev-key-not-secret-32b!", development only.
  '''d2F0Y2hsb2ctZGV2LWtleS1ub3Qtc2VjcmV0LTMyYiE=''',
  # Reviewed 2026-11-09: a made-up generated password in the responsive suite's fixture
  # (web/e2e/fixtures/applications.ts, commit f6ef503); it was never a real credential.
  '''wl_mon_Qx7fK2mT9bLr4Wc8Nz3Hd5Vp1''',
  # Reviewed 2026-11-13: a metric key in the rule editor's list (web/src/lib/alerts.ts,
  # commit 76477a9), `key: 'traefik.latency.p95'`, read as a generic API key.
  '''traefik\.latency\.p95''',
]
