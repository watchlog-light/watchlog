apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: watchlog
  name: watchlog-agent-cluster-agent
  labels:
    app.kubernetes.io/name: watchlog-agent
    app.kubernetes.io/instance: watchlog-agent
    app.kubernetes.io/version: "dev"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: watchlog-agent-0.2.0
    app.kubernetes.io/component: cluster-agent
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/instance: watchlog-agent
      app.kubernetes.io/component: cluster-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: watchlog-agent
        app.kubernetes.io/instance: watchlog-agent
        app.kubernetes.io/version: "dev"
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: watchlog-agent-0.2.0
        app.kubernetes.io/component: cluster-agent
    spec:
      serviceAccountName: watchlog-agent-cluster-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cluster-agent
          image: WATCHLOG_INSTALL_REGISTRY/cluster-agent:WATCHLOG_INSTALL_TAG
          imagePullPolicy: IfNotPresent
          args:
            - --podmap-cert=/etc/watchlog/podmap/tls.crt
            - --podmap-key=/etc/watchlog/podmap/tls.key
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: WATCHLOG_NODE_AGENT_SA
              value: watchlog-agent
            - name: GOMEMLIMIT
              value: "400MiB"
            # Logs on demand (ADR-167); read nil-safe, so an upgrade keeps them on (ADR-107).
            - name: WATCHLOG_LOGS
              value: "true"
            - name: WATCHLOG_ENDPOINT
              value: "WATCHLOG_INSTALL_ENDPOINT"
            - name: WATCHLOG_TOKEN
              valueFrom:
                secretKeyRef:
                  name: watchlog-agent-token
                  key: token
          ports:
            - { name: podmap, containerPort: 8443 }
          readinessProbe:
            httpGet: { path: /healthz, port: podmap, scheme: HTTPS }
            periodSeconds: 5
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: podmap-tls, mountPath: /etc/watchlog/podmap, readOnly: true }
            - { name: data, mountPath: /var/lib/watchlog-agent }
      volumes:
        - name: podmap-tls
          secret: { secretName: watchlog-agent-podmap-tls }
        - { name: data, emptyDir: { sizeLimit: 256Mi } }
